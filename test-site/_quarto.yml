project:
  type: website
  output-dir: _site
  post-render:
    - _extensions/serika/glass/build-network.ts
  render:
    - "*.qmd"
    - "posts/*.qmd"

lang: ja

website:
  title: "Serika Glass UI Lab"
  navbar:
    pinned: false
    left:
      - href: index.qmd
        text: Hub
      - href: playground.qmd
        text: Playground
      - href: long-read.qmd
        text: Long read
      - href: components.qmd
        text: Components
      - href: layout-states.qmd
        text: Layout
    right:
      - icon: github
        href: https://github.com/SerikaYuzuki/quarto-serika
  sidebar:
    style: docked
    search: true
    contents:
      - section: "Lab"
        contents:
          - href: index.qmd
            text: Hub / listing
          - href: playground.qmd
            text: Playground
          - href: long-read.qmd
            text: Long read
      - section: "Regression"
        contents:
          - href: components.qmd
            text: Component gallery
          - href: layout-states.qmd
            text: Layout and motion
      - section: "Fixture posts"
        contents:
          - href: posts/glass-frame.qmd
            text: Glass frame
          - href: posts/paper-content.qmd
            text: Paper content
          - href: posts/reading-hud.qmd
            text: Reading HUD
          - href: posts/observatory-notes.qmd
            text: Observatory notes
          - href: posts/constellation-edges.qmd
            text: Constellation edges
          - href: posts/motion-tokens.qmd
            text: Motion tokens
  page-navigation: true
  back-to-top-navigation: true

format:
  html:
    theme:
      light: _extensions/serika/glass/theme-glass-light.scss
      dark: _extensions/serika/glass/theme-glass-dark.scss
    css: _extensions/serika/glass/styles.css
    include-in-header:
      - _extensions/serika/glass/budoux.html
      - _extensions/serika/glass/network.html
      - _extensions/serika/glass/sidebar-toggle.html
      - _extensions/serika/glass/plotly-config.html
      - _extensions/serika/glass/selection-ai.html
    toc: true
    toc-title: "このページ"
    toc-location: right
    toc-depth: 3
    code-fold: true
    code-summary: "コードを表示"
    code-copy: true
